schema_version: "0.3.0"
id: "customer-pc-01"
label: "Customer PC-01"
kind: "workstation"
site: "Customer Residence"
environment: "Customer LAN"
zone: "Private LAN"
role: "Customer workstation"
summary: "Representative customer endpoint used to originate public-service scenarios."
lifecycle: "design"
tags:
  - "customer"
  - "endpoint"
render:
  - view: "customer/customer-lan"
    node: "pc-01"
    mode: "any"
interfaces:
  - id: "fast-ethernet-0"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses:
      - "192.168.0.2/24"
    vlans:
      - 1
behavior:
  family: "endpoint"
  accepted_services: []
  respond_to_icmp: true
