schema_version: "0.9.0"
id: "customer-pc-02"
label: "Customer PC-02"
kind: "workstation"
site: "Customer Residence"
environment: "Customer LAN"
zone: "Private LAN"
role: "Customer workstation"
summary: "Representative customer endpoint used to originate public-service scenarios."
lifecycle: "design"
tags:
  - "customer"
  - "endpoint"
  - "interactive"
default_gateway: "192.168.0.1"
render:
  - view: "customer/customer-lan"
    node: "pc-02"
    mode: "any"
interfaces:
  - id: "fast-ethernet-0"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:00:01:03"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses:
      - "192.168.0.3/24"
    vlans:
      - 1
behavior:
  family: "endpoint"
  accepted_services: []
  respond_to_icmp: true
  hostname: "customer-pc-02"
  dns_servers:
    - "198.51.100.50"
