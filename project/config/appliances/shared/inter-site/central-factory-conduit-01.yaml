schema_version: "0.10.0"
id: "central-factory-conduit-01"
label: "Encrypted Factory Conduit-01"
kind: "encrypted-conduit"
site: "Central Office to Factory"
environment: "Inter-site WAN"
zone: "Governed Conduit"
role: "Authenticated inter-site transport"
summary: "Carries only named data and administrative workflows; factory operation remains local when unavailable."
lifecycle: "design"
tags: []
render:
