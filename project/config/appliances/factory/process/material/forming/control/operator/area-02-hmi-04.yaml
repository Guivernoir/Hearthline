schema_version: "0.10.0"
id: "area-02-hmi-04"
label: "AREA-02-HMI-04"
kind: "hmi"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Robotic demoulding and operator-handoff HMI"
summary: "Local operator panel for robot position, gripped-piece presence, mould pickup, and operator-delivery commands through the forming PLC."
lifecycle: "simulated"
tags:
  - "ot-area-02"
  - "module-robotic-demould"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/forming"
    node: "area-02-hmi-04"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions: ["observe", "acknowledge-alarms", "authorized-command"]
  signal_tags:
    - "area-02-pos-03"
    - "area-02-pe-01"
  command_tags:
    - "area-02-robot-01-command"
