schema_version: "0.10.0"
id: "area-02-hmi-02"
label: "AREA-02-HMI-02"
kind: "hmi"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Pressure-casting mould module HMI"
summary: "Local operator panel for mould pressure, temperature, fill-head and mould position, mould motion, cycle start, and machine-safety reset."
lifecycle: "simulated"
tags:
  - "ot-area-02"
  - "module-pressure-casting"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/forming"
    node: "area-02-hmi-02"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions: ["observe", "acknowledge-alarms", "authorized-command", "reset-safety", "run-sequence"]
  signal_tags:
    - "area-02-pt-02"
    - "area-02-tt-02"
    - "area-02-pos-01"
    - "area-02-pos-02"
  command_tags:
    - "area-02-mould-01-command"
