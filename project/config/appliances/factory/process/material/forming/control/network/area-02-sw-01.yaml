kind: "layer-2-switch"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming-cell industrial access switch"
summary: "Connects the embedded machine PC, four mould HMIs, robot controller, operator pendant, six I/O stations, and redundant Level 3 uplinks on the isolated forming-cell VLAN."
lifecycle: "design"
tags:
  - "ot-area-02"
  - "control-network"
render:
