schema_version: "0.10.0"
id: "area-02-sw-01"
label: "AREA-02-SW-01"
kind: "layer-2-switch"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming-cell industrial access switch"
summary: "Connects the SCADA station, module HMIs, distributed I/O, and redundant Level 3 uplinks on the isolated forming-cell VLAN."
lifecycle: "design"
tags:
  - "ot-area-02"
  - "control-network"
render:
  - view: "factory/process/forming"
    node: "area-02-sw-01"
    mode: "any"
interfaces:
  - id: "cell-uplink"
    hardware: "ethernet-sfp"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 10000, duplex: "full", mtu: 1500 }
    mode: "trunk"
    addresses: []
    vlans: [102, 302]
  - id: "cell-uplink-standby"
    hardware: "ethernet-sfp"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 10000, duplex: "full", mtu: 1500 }
    mode: "trunk"
    addresses: []
    vlans: [102, 302]
  - id: "scada-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
  - id: "hmi-slip-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
  - id: "hmi-press-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
  - id: "hmi-utilities-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
  - id: "hmi-robot-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
  - id: "remote-io-access"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "ethernet-switch"
  vlans: [102, 302]
  management_vlan: 302
  spanning_tree: true
