schema_version: "0.3.0"
id: "area-02-sw-01"
label: "AREA-02-SW-01"
kind: "layer-2-switch"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming-cell access switch"
summary: "Cell uplink. Machine VLAN attachment."
lifecycle: "design"
tags:
  - "ot-area-02"
  - "network"
render:
  - view: "factory/process/forming"
    node: "area-02-sw-01"
    mode: "any"
interfaces:
  - id: "cell-uplink"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans:
      - 102
      - 302
  - id: "cell-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 102
  - id: "cell-uplink-standby"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans: []
  - id: "remote-io-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans: []
behavior:
  family: "ethernet-switch"
  vlans:
    - 102
    - 302
  management_vlan: 302
  spanning_tree: true
