schema_version: "0.10.0"
id: "area-02-scada-01"
label: "AREA-02-SCADA-01"
kind: "scada-workstation"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming supervisory control and data acquisition workstation"
summary: "Industrial PC providing the complete slip-casting cell overview, alarm handling, trends, and authorized supervisory commands through the PLC tag interface."
lifecycle: "simulated"
tags:
  - "ot-area-02"
  - "scada"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/forming"
    node: "area-02-scada-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
    - "reset-safety"
    - "run-sequence"
    - "inject-faults"
    - "publish-telemetry"
  signal_tags: []
  command_tags:
    - "area-02-slip-01-command"
    - "area-02-mould-01-command"
    - "area-02-water-01-command"
    - "area-02-air-01-command"
    - "area-02-vac-01-command"
    - "area-02-robot-01-command"
