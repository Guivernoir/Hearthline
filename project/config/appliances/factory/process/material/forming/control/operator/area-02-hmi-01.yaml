    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions: ["observe", "acknowledge-alarms", "authorized-command"]
  signal_tags:
    - "area-02-lt-01"
    - "area-02-dt-01"
    - "area-02-vis-01"
    - "area-02-tt-01"
    - "area-02-ft-01"
    - "area-02-pt-01"
  command_tags:
    - "area-02-slip-01-command"
