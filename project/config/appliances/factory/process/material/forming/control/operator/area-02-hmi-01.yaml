schema_version: "0.10.0"
id: "area-02-hmi-01"
label: "AREA-02-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Mould 1 local operator panel"
summary: "Keyed local panel for Mould 1 enable, automatic status, manual movement, and authenticated setup movement. Process-sensor bypass never overrides hardwired safety."
lifecycle: "simulated"
tags:
  - "ot-area-02"
  - "station-mould-01"
  - "mould-panel"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/forming"
    node: "area-02-hmi-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 1000, duplex: "full", mtu: 1500 }
    mode: "access"
    addresses: []
    vlans: [102]
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions: ["observe", "acknowledge-alarms", "authorized-command", "reset-safety", "start-mould", "stop-mould-after-phase", "end-mould-after-cycle"]
  signal_tags:
    - "area-02-pt-02"
    - "area-02-tt-02"
    - "area-02-pos-01"
    - "area-02-pos-02"
    - "area-02-mt-02"
    - "area-02-m01-inc-01"
  command_tags:
    - "area-02-mould-01-command"
  safety_components: ["area-02-safe-01", "area-02-cell-guard-safe-01"]
  control_station:
    station_type: "mould-panel"
    target: "mould-01"
    mode_selector:
      positions: ["manual", "auto", "setup"]
      initial_position: "auto"
      setup_password_sha256: "0dd7fd00e4a8872cfa378eebdca94f9c8a898dd328f8b0aeb0b5dd0f69a09c72"
      bypassed_permissives: ["process-sensor-permissives"]
      retained_protections: ["emergency-stop-chain", "hardwired-travel-limits"]
