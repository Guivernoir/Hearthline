schema_version: "0.10.0"
id: "area-02-hmi-01"
label: "AREA-02-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Ceramic-slip supply module HMI"
summary: "Local operator panel for slip level, density, viscosity, temperature, flow, feed pressure, and filling or drain commands through the forming PLC."
lifecycle: "simulated"
tags:
  - "ot-area-02"
  - "module-slip-supply"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/forming"
    node: "area-02-hmi-01"
    mode: "any"
interfaces:
