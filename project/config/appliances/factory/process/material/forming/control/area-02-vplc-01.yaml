schema_version: "0.9.0"
id: "area-02-vplc-01"
label: "AREA-02-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming and transfer controller"
summary: "Machine sequence. Transfer coordination."
lifecycle: "design"
tags:
  - "ot-area-02"
  - "controller"
render:
  - view: "factory/process/forming"
    node: "area-02-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/forming/area-02-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-02-vplc-01.yaml"
