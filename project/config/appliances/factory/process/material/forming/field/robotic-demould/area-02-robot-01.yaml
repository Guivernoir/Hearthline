schema_version: "0.10.0"
id: "area-02-robot-01"
label: "AREA-02-ROBOT-01"
kind: "field-actuator"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Six-axis robotic demoulding manipulator"
summary: "Executes controller-generated motion to collect green pieces from four mould stations and deliver each piece to its assigned operator handoff."
lifecycle: "simulated"
tags: ["ot-area-02", "actuator", "station-robot", "robot", "six-axis-manipulator"]
render:
  - { view: "factory/process/forming", node: "area-02-robot-01", mode: "any" }
interfaces:
  - id: "motion-bus"
    hardware: "field-io-channel"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 100, duplex: "full", mtu: 256 }
    mode: "field-io"
    addresses: []
    vlans: []
behavior:
  family: "field-actuator"
  command_tag: "area-02-robot-01-command"
  safe_state: "stopped"
  feedback_tag: "area-02-robot-01-feedback"
  states: ["stopped", "servo-ready", "home", "approaching", "pickup-positioning", "gripping", "grip-confirm", "delivering", "operator-handoff", "releasing", "release-confirm", "handoff-retreat", "returning", "faulted"]
