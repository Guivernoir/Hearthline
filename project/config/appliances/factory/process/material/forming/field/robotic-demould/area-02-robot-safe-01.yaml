schema_version: "0.10.0"
id: "area-02-robot-safe-01"
label: "AREA-02-ROBOT-SAFE-01"
kind: "safety-interface"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Robot hardwired safety and motion-limit interface"
summary: "Keeps the emergency-stop chain, enabling circuit, and hardwired axis travel limits authoritative in auto, manual, and setup modes."
lifecycle: "simulated"
tags: ["ot-area-02", "safety interface", "station-robot", "robot"]
render:
  - { view: "factory/process/forming", node: "area-02-robot-safe-01", mode: "any" }
interfaces:
  - id: "field-io"
    hardware: "field-io-channel"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 10, duplex: "half", mtu: 256 }
    mode: "field-io"
    addresses: []
    vlans: []
  - id: "controller-safety"
    hardware: "field-io-channel"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 10, duplex: "full", mtu: 256 }
    mode: "field-io"
    addresses: []
    vlans: []
behavior:
  family: "safety"
  permissives: ["emergency-stop-healthy", "enabling-circuit-healthy", "hardwired-axis-limits-healthy", "robot-cell-clear", "process-sensors-ready"]
  latched_trip: false
  initially_permissive: ["emergency-stop-healthy", "enabling-circuit-healthy", "hardwired-axis-limits-healthy", "robot-cell-clear", "process-sensors-ready"]
