schema_version: "0.10.0"
id: "area-02-safe-01"
label: "AREA-02-SAFE-01"
kind: "safety-interface"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Pressure-casting machine safety and permissive status interface"
summary: "Exposes guard, emergency-stop, clamping, mould, slip-supply, and transfer permissives while the protective function remains separate from standard control."
lifecycle: "simulated"
tags: ["ot-area-02", "safety interface", "module-pressure-casting"]
render:
  - { view: "factory/process/forming", node: "area-02-safe-01", mode: "any" }
interfaces:
  - id: "field-io"
    hardware: "field-io-channel"
    state: { administrative: "up", initial_operational: "up" }
    settings: { speed_mbps: 10, duplex: "half", mtu: 256 }
    mode: "field-io"
    addresses: []
    vlans: []
behavior:
  family: "safety"
  permissives:
    - "emergency-stop-healthy"
    - "guard-closed"
    - "compressed-air-ready"
    - "mould-installed"
    - "slip-supply-ready"
    - "demould-unit-retracted"
    - "transfer-clear"
  latched_trip: false
  initially_permissive:
    - "emergency-stop-healthy"
    - "guard-closed"
    - "compressed-air-ready"
    - "mould-installed"
    - "slip-supply-ready"
    - "demould-unit-retracted"
    - "transfer-clear"
