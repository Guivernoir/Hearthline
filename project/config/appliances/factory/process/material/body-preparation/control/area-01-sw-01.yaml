schema_version: "0.10.0"
id: "area-01-sw-01"
label: "AREA-01-SW-01"
kind: "layer-2-switch"
site: "Factory"
environment: "Body Preparation"
zone: "OT-AREA-01"
role: "Industrial access switch"
summary: "Cell uplink. Managed industrial Ethernet."
lifecycle: "design"
tags:
  - "ot-area-01"
  - "network"
render:
  - view: "factory/process/body-preparation"
    node: "area-01-sw-01"
    mode: "any"
interfaces:
  - id: "cell-uplink"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans:
      - 101
      - 301
  - id: "cell-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 101
  - id: "cell-uplink-standby"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans: []
  - id: "remote-io-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans: []
behavior:
  family: "ethernet-switch"
  vlans:
    - 101
    - 301
  management_vlan: 301
  spanning_tree: true
