schema_version: "0.10.0"
id: "area-01-vplc-01"
label: "AREA-01-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Body Preparation"
zone: "OT-AREA-01"
role: "Body preparation sequence controller"
summary: "Mixing and transfer sequence. Simulated I/O binding pending."
lifecycle: "design"
tags:
  - "ot-area-01"
  - "controller"
render:
  - view: "factory/process/body-preparation"
    node: "area-01-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/body-preparation/area-01-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-01-vplc-01.yaml"
