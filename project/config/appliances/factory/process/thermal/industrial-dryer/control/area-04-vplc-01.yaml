schema_version: "0.3.0"
id: "area-04-vplc-01"
label: "AREA-04-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Industrial Dryer"
zone: "OT-AREA-04"
role: "Industrial dryer sequence controller"
summary: "Thermal profile. Load and discharge sequence."
lifecycle: "design"
tags:
  - "ot-area-04"
  - "controller"
render:
  - view: "factory/process/industrial-dryer"
    node: "area-04-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/industrial-dryer/area-04-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-04-vplc-01.yaml"
