schema_version: "0.3.0"
id: "area-05-sw-01"
label: "AREA-05-SW-01"
kind: "layer-2-switch"
site: "Factory"
environment: "Color and Glaze"
zone: "OT-AREA-05"
role: "Glaze-area access switch"
summary: "Application-cell uplink."
lifecycle: "design"
tags:
  - "ot-area-05"
  - "network"
render:
  - view: "factory/process/color-and-glaze"
    node: "area-05-sw-01"
    mode: "any"
interfaces:
  - id: "cell-uplink"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans:
      - 105
      - 305
  - id: "cell-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 105
  - id: "cell-uplink-standby"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans: []
  - id: "remote-io-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans: []
behavior:
  family: "ethernet-switch"
  vlans:
    - 105
    - 305
  management_vlan: 305
  spanning_tree: true
