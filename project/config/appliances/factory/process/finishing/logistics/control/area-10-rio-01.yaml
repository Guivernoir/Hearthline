schema_version: "0.9.0"
id: "area-10-rio-01"
label: "AREA-10-RIO-01"
kind: "remote-io"
site: "Factory"
environment: "Logistics"
zone: "OT-AREA-10"
role: "Logistics field I/O termination"
summary: "Cell-local sensor and actuator termination. Cell network extends to the assigned vPLC runtime. No process sequence logic executes in the I/O station."
lifecycle: "design"
tags:
  - "ot-area-10"
  - "distributed I/O"
render:
