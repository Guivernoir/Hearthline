schema_version: "0.10.0"
id: "area-10-sw-01"
label: "AREA-10-SW-01"
kind: "layer-2-switch"
site: "Factory"
environment: "Logistics"
zone: "OT-AREA-10"
role: "Logistics-cell access switch"
summary: "Packing and warehouse uplink."
lifecycle: "design"
tags:
  - "ot-area-10"
  - "network"
render:
  - view: "factory/process/logistics"
    node: "area-10-sw-01"
    mode: "any"
interfaces:
  - id: "cell-uplink"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans:
      - 110
      - 310
  - id: "cell-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 110
  - id: "cell-uplink-standby"
    hardware: "ethernet-sfp"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "trunk"
    addresses: []
    vlans: []
  - id: "remote-io-access"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans: []
behavior:
  family: "ethernet-switch"
  vlans:
    - 110
    - 310
  management_vlan: 310
  spanning_tree: true
