schema_version: "0.3.0"
id: "area-10-hmi-01"
label: "AREA-10-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Logistics"
zone: "OT-AREA-10"
role: "Logistics operator HMI"
summary: "Order and line status."
lifecycle: "design"
tags:
  - "ot-area-10"
  - "operator interface"
render:
  - view: "factory/process/logistics"
    node: "area-10-hmi-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 110
behavior:
  family: "operator-interface"
  controller: "area-10-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
