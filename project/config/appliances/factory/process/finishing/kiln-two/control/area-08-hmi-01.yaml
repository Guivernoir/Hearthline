    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 108
behavior:
  family: "operator-interface"
  controller: "area-08-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
    - "reset-safety"
  command_tags:
    - "area-08-bnr-01-command"
    - "area-08-fan-01-command"
