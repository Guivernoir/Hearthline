schema_version: "0.9.0"
id: "area-08-hmi-01"
label: "AREA-08-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Kiln 2"
zone: "OT-AREA-08"
role: "Kiln 2 operator HMI"
summary: "Profile and alarm display."
lifecycle: "simulated"
tags:
  - "ot-area-08"
  - "operator interface"
  - "interactive"
render:
  - view: "factory/process/kiln-two"
    node: "area-08-hmi-01"
    mode: "any"
interfaces:
