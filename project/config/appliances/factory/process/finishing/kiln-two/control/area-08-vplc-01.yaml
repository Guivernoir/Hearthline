schema_version: "0.9.0"
id: "area-08-vplc-01"
label: "AREA-08-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Kiln 2"
zone: "OT-AREA-08"
role: "Kiln 2 firing-profile controller"
summary: "Second firing profile. Zone coordination."
lifecycle: "design"
tags:
  - "ot-area-08"
  - "controller"
render:
  - view: "factory/process/kiln-two"
    node: "area-08-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/kiln-two/area-08-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-08-vplc-01.yaml"
