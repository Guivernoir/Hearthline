schema_version: "0.9.0"
id: "area-07-vplc-01"
label: "AREA-07-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Intermediate Inspection"
zone: "OT-AREA-07"
role: "Inspection routing controller"
summary: "Result handling. Route selection."
lifecycle: "design"
tags:
  - "ot-area-07"
  - "controller"
render:
  - view: "factory/process/intermediate-inspection"
    node: "area-07-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/intermediate-inspection/area-07-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-07-vplc-01.yaml"
