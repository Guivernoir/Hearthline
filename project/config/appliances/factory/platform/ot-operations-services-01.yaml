schema_version: "0.10.0"
id: "ot-operations-services-01"
label: "OT Operations Services-01"
kind: "service-cluster"
site: "Factory"
environment: "OT Operations"
zone: "Level 3"
role: "Factory-local SCADA, historian, engineering, and OT management services"
summary: "Maintains local supervision and operations data when the inter-site conduit is unavailable."
lifecycle: "design"
tags: []
default_gateway: "10.20.0.1"
render:
  - view: "factory/process"
    node: "ot-operations"
    mode: "any"
interfaces:
  - id: "level-three"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:20:00:20"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses:
      - "10.20.0.20/24"
    vlans: []
  - id: "level-three-standby"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:20:00:21"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses:
      - "10.20.0.21/24"
    vlans: []
behavior:
  family: "service-host"
  accepted_services:
    - "scada"
    - "historian"
    - "engineering"
    - "management"
  respond_to_icmp: true
