schema_version: "0.10.0"
id: "ot-frw-01a"
label: "OT FRW-01A"
kind: "firewall"
site: "Factory"
environment: "Factory OT DMZ"
zone: "OT Southbound Security"
role: "High-availability stateful policy enforcement member"
summary: "Independently enforces named conduits between Level 3.5 services and Level 3 OT."
lifecycle: "design"
tags: []
render:
  - view: "factory/ot-dmz"
    node: "south-firewall"
    mode: "any"
interfaces:
  - id: "dmz"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:35:fe:04"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses:
      - "172.20.52.4/24"
    vlans:
      - 352
  - id: "level-three"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:20:fe:01"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses:
      - "10.20.254.1/30"
    vlans: []
behavior:
  family: "stateful-firewall"
  stateful: true
  default_action: "deny"
  zones:
    - interface: "level-three"
      name: "level-three"
    - interface: "dmz"
      name: "ot-dmz"
  routes:
    - destination: "10.20.254.0/30"
      next_hop: null
      interface: "level-three"
    - destination: "10.20.0.0/24"
      next_hop: "10.20.254.2"
      interface: "level-three"
    - destination: "172.20.52.0/24"
      next_hop: null
      interface: "dmz"
  rules:
    - name: "permit-local-historian-to-dmz-replica"
      action: "permit"
      source_zone: "level-three"
      destination_zone: "ot-dmz"
      source: "10.20.0.20/32"
      destination: "172.20.52.10/32"
      service: "historian-replication"
