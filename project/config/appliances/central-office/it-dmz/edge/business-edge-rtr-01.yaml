schema_version: "0.9.0"
id: "business-edge-rtr-01"
label: "Business EDGE-RTR-01"
kind: "nat-router"
site: "Central Office"
environment: "Business IT DMZ"
zone: "Enterprise Edge"
role: "Enterprise Internet edge and static NAT member"
summary: "Routes business Internet traffic and publishes the public web address through static NAT."
lifecycle: "design"
tags: []
render:
  - view: "customer/public-web-path"
    node: "business-edge"
    mode: "any"
  - view: "office/it-dmz"
    node: "business-edge"
    mode: "any"
interfaces:
  - id: "outside"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:30:01:01"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses:
      - "192.0.2.2/24"
    vlans:
      - 1
  - id: "inside"
    hardware: "ethernet-rj45"
    mac_address: "02:00:00:30:01:02"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses:
      - "10.255.0.1/30"
    vlans:
      - 1
behavior:
  family: "nat-router"
  routes:
    - destination: "0.0.0.0/0"
      next_hop: "192.0.2.1"
      interface: "outside"
    - destination: "172.16.10.0/24"
      next_hop: "10.255.0.2"
      interface: "inside"
  inside_interfaces:
    - "inside"
  outside_interfaces:
    - "outside"
  translations:
    - public_address: "192.0.2.10"
      private_address: "172.16.10.2"
