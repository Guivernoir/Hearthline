      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "transparent"
    addresses: []
    vlans: []
  - id: "customer"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "transparent"
    addresses: []
    vlans: []
behavior:
  family: "transparent-link"
  operational: true
