schema_version: "0.10.0"
id: "operations-soc-console-01"
label: "Central SOC Console-01"
kind: "operations-console"
site: "Central Office"
environment: "Operations Intelligence"
zone: "Security operations console"
role: "Security operations console"
summary: "Managed security operations endpoint with a session-local queue for modeled detection evidence and analyst acknowledgement."
lifecycle: "simulated"
tags:
  - "interactive"
  - "security-operations"
render:
  - view: "office/operations-intelligence"
    node: "central-soc"
    mode: "any"
interfaces:
  - id: "enterprise"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "endpoint"
  accepted_services: []
  respond_to_icmp: true
