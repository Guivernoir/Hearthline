schema_version: "0.3.0"
id: "operations-analytics-01"
label: "Process Analytics Platform-01"
kind: "analytics-platform"
site: "Central Office"
environment: "Operations Intelligence"
zone: "Operations Analytics"
role: "Enterprise process analytics platform"
summary: "Analyzes selected brokered production, quality, energy, and maintenance data."
lifecycle: "design"
tags: []
render:
  - view: "office/operations-intelligence"
    node: "analytics-platform"
    mode: "any"
interfaces:
  - id: "enterprise"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "service-host"
  accepted_services:
    - "https"
    - "analytics"
  respond_to_icmp: true
