schema_version: "0.2.0"
id: "ot-sensor-01-capture"
label: "OT sensor 01 passive capture"
lifecycle: "design"
transport: "mirror"
medium:
  type: "copper"
  wiring: "straight-through"
  category: "cat6a"
  length_m: 3.0
endpoints:
  a:
    appliance: "ot-dmz-sw-01"
    interface: "sensor-01-span"
  b:
    appliance: "ot-sensor-01"
    interface: "capture"
properties:
  capacity_mbps: 1000
  latency_ms: 0
  loss_every: null
  direction: "a-to-b"
  operational: true
tags:
  - "ot-dmz"
  - "passive-monitoring"
