schema_version: "0.11.0"
id: "customer-public-web-request"
label: "Customer public web request"
summary: "Customer PC-01 receives a configured shopping response through customer PAT, provider transit, business static NAT, both firewall boundaries, the DMZ web gateway, and the internal application tier."
category: "public-service"
participants:
  - "customer-pc-01"
  - "customer-sw-01"
  - "customer-rtr-01"
  - "customer-inet-cpe-01"
  - "wan-01"
  - "isp-edge-rtr-01"
  - "wan-02a"
  - "business-inet-cpe-01"
  - "business-edge-rtr-01"
  - "business-frw-01a"
  - "business-it-dmz-sw-01"
  - "business-web-gw-01"
  - "business-frw-02a"
  - "business-it-core-sw-01"
  - "business-it-srv-sw-01"
  - "business-it-services-01"
source: "customer-pc-01"
packet:
  source_ip: "192.168.0.2"
  destination_ip: "192.0.2.10"
  ttl: 64
  wire_length_bytes: 768
  transport:
    protocol: "tcp"
    source_port: 55000
    destination_port: 443
    syn: true
  application:
    kind: "http-request"
    method: "get"
    host: "shop.hearthline.test"
    path: "/shop"
    body_bytes: 0
expectation:
  component: "customer-pc-01"
  outcome: "delivered"
  service: "https"
event_limit: 512
