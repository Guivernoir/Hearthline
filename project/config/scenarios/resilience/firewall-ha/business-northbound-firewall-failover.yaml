schema_version: "0.12.0"
id: "business-northbound-firewall-failover"
label: "Northbound firewall failover"
summary: "The OT DMZ historian publishes approved HTTPS operations data through firewall member A, then repeats the request after the converged data path and virtual interface ownership move to member B."
category: "availability"
participants:
  - "ot-dmz-hist-replica-01"
  - "ot-dmz-sw-01"
  - "ot-dmz-sw-02"
  - "central-factory-conduit-01"
  - "business-frw-03a"
  - "business-frw-03b"
  - "business-it-core-sw-01"
  - "business-it-core-sw-02"
  - "business-it-srv-sw-01"
  - "operations-analytics-01"
source: "ot-dmz-hist-replica-01"
packet:
  source_ip: "172.20.52.10"
  destination_ip: "10.10.80.50"
  ttl: 64
  wire_length_bytes: 512
  transport:
    protocol: "tcp"
    source_port: 44002
    destination_port: 443
    syn: true
  application:
    kind: "service"
    service: "analytics"
connection_overrides:
  - connection: "business-core-02-to-frw-03b"
    operational: false
  - connection: "business-frw-03b-to-central-conduit-2"
    operational: false
  - connection: "central-conduit-2-to-ot-dmz-sw-02"
    operational: false
recovery:
  label: "Fail over to FRW-03B"
  summary: "Withdraw member A's northbound path, restore member B's path, transfer both firewall virtual interfaces and the HA role, and verify the unchanged approved HTTPS request."
  connection_overrides:
    - connection: "business-core-01-to-frw-03a"
      operational: false
    - connection: "business-frw-03a-to-central-conduit-1"
      operational: false
    - connection: "central-conduit-1-to-ot-dmz-sw-01"
      operational: false
    - connection: "business-core-02-to-frw-03b"
      operational: true
    - connection: "business-frw-03b-to-central-conduit-2"
      operational: true
    - connection: "central-conduit-2-to-ot-dmz-sw-02"
      operational: true
  first_hop_overrides:
    - appliance: "business-frw-03a"
      interface: "business-it"
      role: "standby"
    - appliance: "business-frw-03a"
      interface: "factory-conduit"
      role: "standby"
    - appliance: "business-frw-03b"
      interface: "business-it"
      role: "active"
    - appliance: "business-frw-03b"
      interface: "factory-conduit"
      role: "active"
  firewall_ha_overrides:
    - appliance: "business-frw-03a"
      role: "standby"
    - appliance: "business-frw-03b"
      role: "active"
  expectation:
    component: "operations-analytics-01"
    outcome: "delivered"
    service: "analytics"
expectation:
  component: "operations-analytics-01"
  outcome: "delivered"
  service: "analytics"
event_limit: 256
