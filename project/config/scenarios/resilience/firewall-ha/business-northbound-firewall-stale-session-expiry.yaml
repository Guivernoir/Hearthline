schema_version: "0.12.0"
id: "business-northbound-firewall-stale-session-expiry"
label: "Northbound firewall stale-session expiry"
summary: "An approved historian TCP session is replicated before the HA link fails; member B promotes with the retained state, then rejects a reverse ACK after the idle TCP session reaches its deterministic 300-second expiry."
category: "availability"
participants:
  - "ot-dmz-hist-replica-01"
  - "ot-dmz-sw-01"
  - "ot-dmz-sw-02"
  - "central-factory-conduit-01"
  - "business-frw-03a"
  - "business-frw-03b"
  - "business-it-core-sw-01"
  - "business-it-core-sw-02"
  - "business-it-srv-sw-01"
  - "operations-analytics-01"
source: "ot-dmz-hist-replica-01"
packet:
  source_ip: "172.20.52.10"
  destination_ip: "10.10.80.50"
  ttl: 64
  wire_length_bytes: 512
  transport:
    protocol: "tcp"
    source_port: 44006
    destination_port: 443
    syn: true
  application:
    kind: "service"
    service: "analytics"
connection_overrides:
  - connection: "business-core-02-to-frw-03b"
    operational: false
  - connection: "business-frw-03b-to-central-conduit-2"
    operational: false
  - connection: "central-conduit-2-to-ot-dmz-sw-02"
    operational: false
continuity:
  failed_appliance: "business-frw-03a"
  failure_at_us: 1000000
  continuation_at_us: 301000000
  source: "operations-analytics-01"
  faults:
    - type: "sync-link-loss"
      at_us: 600000
  connection_overrides:
    - connection: "business-core-01-to-frw-03a"
      operational: false
    - connection: "business-frw-03a-to-central-conduit-1"
      operational: false
    - connection: "central-conduit-1-to-ot-dmz-sw-01"
      operational: false
    - connection: "business-core-02-to-frw-03b"
      operational: true
    - connection: "business-frw-03b-to-central-conduit-2"
      operational: true
    - connection: "central-conduit-2-to-ot-dmz-sw-02"
      operational: true
    - connection: "business-frw-03-ha-sync"
      operational: false
  packet:
    source_ip: "10.10.80.50"
    destination_ip: "172.20.52.10"
    ttl: 64
    wire_length_bytes: 256
    transport:
      protocol: "tcp"
      source_port: 443
      destination_port: 44006
      ack: true
    application:
      kind: "service"
      service: "historian-replication"
  expectation:
    component: "business-frw-03b"
    outcome: "dropped"
    reason_contains: "default policy"
expectation:
  component: "operations-analytics-01"
  outcome: "delivered"
  service: "analytics"
event_limit: 512
