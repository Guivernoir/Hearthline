schema_version: "0.12.0"
id: "factory-operations-data"
label: "Factory operations data"
summary: "The OT DMZ historian replica publishes a bounded process-telemetry frame through the governed conduit to Central Office analytics over HTTPS."
category: "industrial-data"
participants:
  - "ot-dmz-hist-replica-01"
  - "ot-dmz-sw-01"
  - "central-factory-conduit-01"
  - "business-frw-03a"
  - "business-it-core-sw-01"
  - "business-it-srv-sw-01"
  - "operations-analytics-01"
source: "ot-dmz-hist-replica-01"
packet:
  source_ip: "172.20.52.10"
  destination_ip: "10.10.80.50"
  ttl: 64
  wire_length_bytes: 512
  transport:
    protocol: "tcp"
    source_port: 44000
    destination_port: 443
    syn: true
  application:
    kind: "telemetry"
    service: "analytics"
    source: "area-02-vplc-01"
    sequence: 0
    payload: '{"cell":"OT-AREA-02","phase":"idle","cycle":0}'
expectation:
  component: "operations-analytics-01"
  outcome: "delivered"
  service: "analytics"
event_limit: 128
