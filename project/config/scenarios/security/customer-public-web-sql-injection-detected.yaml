schema_version: "0.11.0"
id: "customer-public-web-sql-injection-detected"
label: "Customer SQL injection prevented"
summary: "Customer PC-01 submits a controlled form payload through the public HTTPS path; the DMZ web gateway detects a configured SQL tautology signature in the request body and projects defensive evidence to the Central SOC session."
category: "security-exercise"
participants:
  - "customer-pc-01"
  - "customer-sw-01"
  - "customer-rtr-01"
  - "customer-inet-cpe-01"
  - "wan-01"
  - "isp-edge-rtr-01"
  - "wan-02a"
  - "business-inet-cpe-01"
  - "business-edge-rtr-01"
  - "business-frw-01a"
  - "business-it-dmz-sw-01"
  - "business-web-gw-01"
  - "business-frw-02a"
  - "business-it-core-sw-01"
  - "business-it-srv-sw-01"
  - "business-it-services-01"
source: "customer-pc-01"
packet:
  source_ip: "192.168.0.2"
  destination_ip: "192.0.2.10"
  ttl: 64
  wire_length_bytes: 896
  transport:
    protocol: "tcp"
    source_port: 55022
    destination_port: 443
    syn: true
  application:
    kind: "http-request"
    method: "post"
    host: "shop.hearthline.test"
    path: "/shop/login"
    body: "username=admin' OR '1'='1"
    body_bytes: 25
expectation:
  component: "business-web-gw-01"
  outcome: "dropped"
  reason_contains: "SQL injection tautology pattern"
security:
  tactic: "initial-access"
  technique: "sql-injection"
  severity: "high"
  detector: "business-web-gw-01"
  defender: "operations-soc-console-01"
  control: "configured-request-inspection"
event_limit: 512
