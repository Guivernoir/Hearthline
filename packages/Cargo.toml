[workspace]
members = [
    "crates/hearthline-model",
    "crates/hearthline-physics",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-project",
    "crates/hearthline-sim",
    "crates/hearthline-operator",
    "crates/hearthline-cli",
    "crates/hearthline-api",
    "xtask",
]
default-members = [
    "crates/hearthline-model",
    "crates/hearthline-physics",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-project",
    "crates/hearthline-sim",
    "crates/hearthline-operator",
    "crates/hearthline-cli",
    "crates/hearthline-api",
]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/Guivernoir/Hearthline"

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = "=1.0.154"
# Preserve the internal import name while replacing the archived YAML backend.
serde_yaml_ng = { package = "yaml_serde", version = "=0.10.7" }
sha2 = "=0.11.1"
heapless = { version = "=0.9.4", default-features = false }
pest = "=2.9.7"
pest_derive = "=2.9.7"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
url = "=2.5.9"
clap = { version = "=4.6.10", features = ["derive"] }
schemars = "=1.2.3"
tempfile = "=3.27.0"
walkdir = "=2.5.1"
syn = { version = "=3.0.10", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Numerical loops retain checked arithmetic and debug assertions. Optimize only
# this dependency so engineering-sized proof meshes are usable in dev builds.
[profile.dev.package.hearthline-physics]
opt-level = 2
