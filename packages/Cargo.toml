[workspace]
members = [
    "crates/hearthline-model",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-project",
    "crates/hearthline-sim",
    "crates/hearthline-operator",
    "crates/hearthline-cli",
    "crates/hearthline-api",
    "xtask",
]
default-members = [
    "crates/hearthline-model",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-project",
    "crates/hearthline-sim",
    "crates/hearthline-operator",
    "crates/hearthline-cli",
    "crates/hearthline-api",
]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Guivernoir/Hearthline"

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.0"
heapless = { version = "=0.9.3", default-features = false }
pest = "=2.8.8"
pest_derive = "=2.8.8"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
url = "=2.5.8"
clap = { version = "=4.5.48", features = ["derive"] }
schemars = "=1.2.2"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
