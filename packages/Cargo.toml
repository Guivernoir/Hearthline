[workspace]
members = [
    "crates/hearthline-model",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-cli",
    "crates/hearthline-api",
]
default-members = [
    "crates/hearthline-model",
    "crates/hearthline-engine",
    "crates/hearthline-config",
    "crates/hearthline-cli",
    "crates/hearthline-api",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Guivernoir/Hearthline"

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
heapless = { version = "0.9.3", default-features = false }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
