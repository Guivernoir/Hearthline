[package]
name = "hearthline-sim"
description = "Deterministic project scheduling, snapshots, recording, and replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hearthline-physics = { path = "../hearthline-physics", version = "=0.3.2" }
hearthline-config = { path = "../hearthline-config", version = "=0.3.2" }
hearthline-engine = { path = "../hearthline-engine", version = "=0.3.2" }
hearthline-model = { path = "../hearthline-model", version = "=0.3.2" }
hearthline-project = { path = "../hearthline-project", version = "=0.3.2" }
pest.workspace = true
pest_derive.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true

[dev-dependencies]
allocation-counter = "=0.8.1"
criterion = "=0.5.1"
tempfile.workspace = true

[[bench]]
name = "scheduler"
harness = false

[lints]
workspace = true

[[test]]
name = "physics_caloric"
path = "tests/physics_cases/caloric.rs"

[[test]]
name = "physics_material"
path = "tests/physics_cases/material.rs"

[[test]]
name = "physics_basin"
path = "tests/physics_cases/basin.rs"

[[test]]
name = "physics_wet"
path = "tests/physics_cases/wet.rs"

[[test]]
name = "physics_capacity"
path = "tests/physics_cases/capacity.rs"

[[test]]
name = "physics_reconstruction"
path = "tests/physics_cases/reconstruction.rs"
