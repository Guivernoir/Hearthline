name: Hearthline Nightly Evidence

on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  coverage-security:
    name: Coverage, dependencies, and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with: { toolchain: nightly-2026-08-20, components: llvm-tools-preview }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: packages, shared-key: nightly-coverage-Cargo.lock }
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo clean --manifest-path packages/Cargo.toml --target-dir packages/target/llvm-cov-target
      - run: cargo +nightly-2026-08-20 llvm-cov --branch --manifest-path packages/Cargo.toml --workspace --all-features --json --output-path rust-coverage.json
        env:
          RUST_MIN_STACK: "16777216"
      - run: node project/scripts/check-coverage.mjs rust-coverage.json
      - run: cargo audit --file packages/Cargo.lock
      - run: cargo deny --manifest-path packages/Cargo.toml --all-features check
      - run: cargo cyclonedx --manifest-path packages/Cargo.toml --format json
        env: { SOURCE_DATE_EPOCH: "0" }
      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
        working-directory: packages/web
      - run: npm ci && npm audit --audit-level=high && npm test && npm sbom --sbom-format cyclonedx > web-sbom.json
        working-directory: packages/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-coverage-sbom
          path: |
            rust-coverage.json
            packages/**/*.cdx.json
            packages/web/artifacts/coverage
            packages/web/web-sbom.json
          retention-days: 90

  fuzz:
    name: Deep fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - identifiers
          - appliance_yaml
          - connection_yaml
          - blueprint_yaml
          - model_compile
          - partition_runtime
          - snapshot_replay
          - control_program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with: { toolchain: nightly-2026-08-20 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages/fuzz
          shared-key: "nightly-fuzz-${{ matrix.target }}-Cargo.lock"
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-08-20 fuzz run ${{ matrix.target }} --fuzz-dir packages/fuzz packages/fuzz/regression-corpus/${{ matrix.target }} -- -max_total_time=1200

  mutation:
    name: Mutation (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: safety-capacity
            arguments: --file crates/hearthline-engine/src/industrial/process/safety.rs --file crates/hearthline-project/src/capacity.rs
          - area: scheduler-replay
            arguments: --file crates/hearthline-sim/src/scheduler.rs --file crates/hearthline-sim/src/replay.rs
          - area: blueprint-control
            arguments: --file crates/hearthline-project/src/blueprint.rs --file crates/hearthline-engine/src/industrial/process/forming/control.rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: packages
          shared-key: "mutation-${{ matrix.area }}-Cargo.lock"
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Validate mutation scope
        run: |
          mutants="$(cargo mutants --manifest-path packages/Cargo.toml --list ${{ matrix.arguments }})"
          test -n "$mutants"
          printf '%s\n' "$mutants"
      - run: cargo mutants --manifest-path packages/Cargo.toml --copy-target false --timeout 300 --jobs 2 ${{ matrix.arguments }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.area }}
          path: packages/mutants.out
          retention-days: 90

  miri:
    name: Miri deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with: { toolchain: nightly-2026-08-20, components: miri }
      - run: cargo +nightly-2026-08-20 miri test --manifest-path packages/Cargo.toml -p hearthline-model --test domain --test quantity
      - run: cargo +nightly-2026-08-20 miri test --manifest-path packages/Cargo.toml -p hearthline-engine --lib --test link_appliance

  soak-performance:
    name: Soak and deterministic performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: packages, shared-key: soak-bench-Cargo.lock }
      - run: cargo test --manifest-path packages/Cargo.toml -p hearthline-sim --test acceptance --release -- --nocapture
      - run: cargo bench --manifest-path packages/Cargo.toml -p hearthline-engine --bench runtime -- --noplot
      - run: cargo bench --manifest-path packages/Cargo.toml -p hearthline-sim --bench scheduler -- --noplot
      - run: cargo build --manifest-path packages/Cargo.toml --release --bins
      - run: |
          printf '{\n  "hearthlineCliBytes": %s,\n  "hearthlineApiBytes": %s\n}\n' \
            "$(stat --printf='%s' packages/target/release/hearthline)" \
            "$(stat --printf='%s' packages/target/release/hearthline-api)" \
            > runtime-size-report.json
      - run: cargo run --manifest-path packages/Cargo.toml --bin hearthline -- capacity report --format json > capacity-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-soak-performance
          path: |
            capacity-report.json
            runtime-size-report.json
            packages/target/criterion
          retention-days: 90

  browsers:
    name: Browser matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults: { run: { working-directory: packages/web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with: { workspaces: packages, shared-key: browser-api-Cargo.lock }
      - name: Install pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e
        env: { HEARTHLINE_ALL_BROWSERS: "1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with: { name: nightly-playwright, path: packages/web/artifacts/playwright, retention-days: 30 }
