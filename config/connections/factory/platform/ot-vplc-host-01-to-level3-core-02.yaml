schema_version: "0.2.0"
id: "ot-vplc-host-01-to-level3-core-02"
label: "vPLC host 01 data trunk to Level 3 core 02"
lifecycle: "design"
transport: "ethernet"
medium:
  type: "fiber"
  mode: "single-mode"
  connector: "LC"
  length_m: 100.0
endpoints:
  a:
    appliance: "ot-vplc-host-01"
    interface: "cell-trunk-2"
  b:
    appliance: "ot-level3-core-sw-02"
    interface: "vplc-host-01"
properties:
  capacity_mbps: 10000
  latency_ms: 0
  loss_every: null
  direction: "bidirectional"
  operational: true
tags:
  - "ot"
  - "vplc-platform"
