schema_version: "0.3.0"
id: "business-it-dmz-sw-02"
label: "Business IT-DMZ-SW-02"
kind: "layer-2-switch"
site: "Central Office"
environment: "Business IT DMZ"
zone: "Public DMZ"
role: "Public DMZ switching member"
summary: "Provides redundant Layer 2 attachment for the public gateway and both firewall boundaries."
lifecycle: "design"
tags: []
render:
