schema_version: "0.3.0"
id: "area-02-hmi-01"
label: "AREA-02-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Forming"
zone: "OT-AREA-02"
role: "Forming operator HMI"
summary: "Format selection. Machine status."
lifecycle: "design"
tags:
  - "ot-area-02"
  - "operator interface"
render:
  - view: "factory/process/forming"
    node: "area-02-hmi-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 102
behavior:
  family: "operator-interface"
  controller: "area-02-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
