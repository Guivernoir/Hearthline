schema_version: "0.3.0"
id: "area-04-hmi-01"
label: "AREA-04-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Industrial Dryer"
zone: "OT-AREA-04"
role: "Dryer operator HMI"
summary: "Profile and alarm display."
lifecycle: "design"
tags:
  - "ot-area-04"
  - "operator interface"
render:
  - view: "factory/process/industrial-dryer"
    node: "area-04-hmi-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 104
behavior:
  family: "operator-interface"
  controller: "area-04-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
