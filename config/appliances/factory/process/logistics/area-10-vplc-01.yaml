schema_version: "0.3.0"
id: "area-10-vplc-01"
label: "AREA-10-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Logistics"
zone: "OT-AREA-10"
role: "Packing and palletizing controller"
summary: "Packing sequence. Warehouse handoff."
lifecycle: "design"
tags:
  - "ot-area-10"
  - "controller"
render:
  - view: "factory/process/logistics"
    node: "area-10-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/logistics/area-10-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-10-vplc-01.yaml"
