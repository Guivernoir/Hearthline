schema_version: "0.3.0"
id: "area-06-hmi-01"
label: "AREA-06-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Kiln 1"
zone: "OT-AREA-06"
role: "Kiln 1 operator HMI"
summary: "Firing profile and alarm display."
lifecycle: "design"
tags:
  - "ot-area-06"
  - "operator interface"
render:
