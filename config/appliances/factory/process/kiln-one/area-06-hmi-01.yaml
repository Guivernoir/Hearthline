      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 106
behavior:
  family: "operator-interface"
  controller: "area-06-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
