    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/color-and-glaze/area-05-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-05-vplc-01.yaml"
