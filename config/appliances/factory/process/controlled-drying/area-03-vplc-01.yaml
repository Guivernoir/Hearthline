schema_version: "0.3.0"
id: "area-03-vplc-01"
label: "AREA-03-vPLC-01"
kind: "virtual-plc"
site: "Factory"
environment: "Controlled Drying"
zone: "OT-AREA-03"
role: "Residence and environmental controller"
summary: "Accelerated residence clock. Environmental profile."
lifecycle: "design"
tags:
  - "ot-area-03"
  - "controller"
render:
  - view: "factory/process/controlled-drying"
    node: "area-03-vplc-01"
    mode: "logical"
interfaces:
  - id: "cell-network"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
  - id: "cell-network-standby"
    hardware: "virtual-nic"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 10000
      duplex: "full"
      mtu: 1500
    mode: "routed"
    addresses: []
    vlans: []
behavior:
  family: "virtual-controller"
  scan_interval_ms: 100
  program_ref: "logic/ot/process/controlled-drying/area-03-vplc-01.st"
  io_binding: "config/ot/process/bindings/area-03-vplc-01.yaml"
