schema_version: "0.3.0"
id: "area-03-hmi-01"
label: "AREA-03-HMI-01"
kind: "hmi"
site: "Factory"
environment: "Controlled Drying"
zone: "OT-AREA-03"
role: "Drying-room operator HMI"
summary: "Queue and profile visibility."
lifecycle: "design"
tags:
  - "ot-area-03"
  - "operator interface"
render:
  - view: "factory/process/controlled-drying"
    node: "area-03-hmi-01"
    mode: "any"
interfaces:
  - id: "cell-network"
    hardware: "ethernet-rj45"
    state:
      administrative: "up"
      initial_operational: "up"
    settings:
      speed_mbps: 1000
      duplex: "full"
      mtu: 1500
    mode: "access"
    addresses: []
    vlans:
      - 103
behavior:
  family: "operator-interface"
  controller: "area-03-vplc-01"
  permissions:
    - "observe"
    - "acknowledge-alarms"
    - "authorized-command"
